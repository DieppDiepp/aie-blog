# CD stage 1: build the shippable Docker images and push them to GHCR.
# This does NOT touch the VPS yet (deploy is added in a later step). It runs on
# every push to main, in parallel with ci.yml. CI checks correctness fast;
# CD produces the actual artifact to ship ("build once, run anywhere").
name: CD

on:
  push:
    branches: [main]
    # Skip build+deploy when a push touches ONLY prose: root-level content/
    # drafts, docs/, or stray markdown. Real code still triggers (frontend/,
    # backend/, Dockerfiles, compose.prod.yml, these workflow files). Rendering
    # posts live under frontend/content/**, so frontend/** already covers them.
    paths-ignore:
      - 'content/**'
      - 'docs/**'
      - '**/*.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets the auto-provided GITHUB_TOKEN push to GHCR
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx (enables layer caching)
        uses: docker/setup-buildx-action@v3

      # Two images, one per service. Each is tagged twice: an immutable git-SHA
      # tag (for traceability and rollback) and a moving "latest" tag.
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/dieppdiepp/aie-blog-api:latest
            ghcr.io/dieppdiepp/aie-blog-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/dieppdiepp/aie-blog-web:latest
            ghcr.io/dieppdiepp/aie-blog-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CD stage 2: tell the VPS to run the images just pushed. Runs only after the
  # build succeeds. All work happens over SSH from the GitHub runner; the VPS
  # never builds. Connection details and the deploy key come from repo secrets.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code (to get compose.prod.yml)
        uses: actions/checkout@v4

      # Ship the latest compose file to the VPS so its stack definition never
      # drifts from the repo. Secrets (.env.prod) already live on the VPS.
      - name: Copy compose.prod.yml to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: compose.prod.yml
          target: /home/${{ secrets.VPS_USER }}/aie-blog

      # Pull the exact images for this commit and restart the stack. IMAGE_TAG
      # is the git SHA, so the VPS runs the same bytes CI built and tested.
      - name: Pull images and restart the stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/aie-blog
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f compose.prod.yml --env-file .env.prod pull
            docker compose -f compose.prod.yml --env-file .env.prod up -d
            # Remove images no longer used by any container. Uses -a because old
            # versions keep their SHA tag, so dangling-only prune would leave them
            # and disk usage would grow with every deploy.
            docker image prune -a -f
            # Named tunnel: the public address is fixed (aiengineerblog.com), so
            # there is no random URL to scrape. Just confirm the connector
            # registered its edge connections in the Actions log.
            sleep 8
            echo "=== Site: https://aiengineerblog.com ==="
            docker compose -f compose.prod.yml logs cloudflared | grep -Ei 'registered tunnel connection|Connection .* registered' | tail -4 || true
