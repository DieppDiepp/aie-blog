name: CI

# Runs on GitHub's own runners, not the VPS. It only checks that the code
# builds and imports cleanly. Deployment (CD) is a separate future workflow.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync
      - name: Smoke import (app loads without errors)
        run: uv run python -c "import app.main; print('backend import ok')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build (type-checks and compiles the whole app)
        run: npm run build
